[project]
name = "mcp_client_learning"
version = "0.1.0"
description = "A full, modern, secure MCP client built for learning the protocol from the client side"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "oauth", "client", "education"]

dependencies = [
    # Official MCP Python SDK (protocol revision 2025-11-25 era)
    "mcp>=1.27",

    # Anthropic SDK - powers the sampling handler (server-requested completions)
    "anthropic>=0.109",

    # HTTP client; the OAuth layer plugs into httpx's auth interface
    "httpx>=0.28",

    # Settings and validation
    "pydantic>=2.13",
    "pydantic-settings>=2.10",

    # Secure token storage in the OS keychain
    "keyring>=25",

    # SKILL.md frontmatter parsing for SEP-2640 skill verification
    "pyyaml>=6",

    # CLI
    "typer>=0.16",
    "rich>=14",
]

[project.urls]
Homepage = "https://github.com/willtech3/mcp-client-learning"
Repository = "https://github.com/willtech3/mcp-client-learning"

[project.scripts]
mcp-client = "mcp_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_client"]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "UP", "B", "SIM", "I", "N", "C4", "T20",
    "RUF", "ASYNC", "PIE", "PT", "RET", "ARG", "PTH", "ERA",
    "PL", "TRY", "PERF", "S",  # S = bandit security rules: this is a security-focused client
]
ignore = [
    "E501",    # line length handled by formatter
    "T20",     # print is fine in a CLI program
    "TRY003",  # long exception messages are fine
    "PLR0913", # protocol handlers take many parameters
    "PLR2004", # protocol constants
    "S101",    # asserts (used in type narrowing)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG", "PLR2004", "SIM117"]
# The MCP SDK callback Protocols match on parameter NAMES, so `context`
# must keep its name even when unused.
"mcp_client/handlers.py" = ["ARG001", "ARG002"]

[tool.pyright]
include = ["mcp_client"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers"]

[tool.logfire]
ignore_no_config = true
